<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Designer Outfit Selector</title>
  <style>
    /* Smooth black on light cream; dark mode flips to cream on soft black */
    :root {
      --bg: #fffef9;
      --card: #fcf9ef;
      --text: #1a1918;
      --muted: #7a7568;
      --border: #efeadb;
      --accent: #1a1918;
      --accent-text: #fffef9;
      --accent-soft: #f6f1e0;
      --pick: #1a1918;
      --danger: #9b3b2f;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141413;
        --card: #1e1d1b;
        --text: #f3ecdd;
        --muted: #a39d92;
        --border: #34322e;
        --accent: #f3ecdd;
        --accent-text: #141413;
        --accent-soft: #2b2926;
        --pick: #f3ecdd;
        --danger: #e08b7d;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 16px 64px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .wrap { max-width: 960px; margin: 0 auto; }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    h1 { margin: 0; font-size: 1.6rem; letter-spacing: 0.01em; }
    h2 { margin: 0 0 12px; font-size: 1.1rem; }
    h3 { margin: 16px 0 6px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

    .profile-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
    }

    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .full { grid-column: 1 / -1; }

    input, select {
      font: inherit;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      min-width: 0;
    }

    button {
      font: inherit;
      cursor: pointer;
      border-radius: 8px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
    }

    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.icon { border: none; padding: 4px 8px; color: var(--muted); font-size: 1.15rem; line-height: 1; }
    button.icon:hover { color: var(--danger); }
    button.edit { border: none; padding: 4px 8px; color: var(--muted); font-size: 0.85rem; text-decoration: underline; }
    button.edit:hover { color: var(--text); }

    a.edit { padding: 4px 8px; color: var(--muted); font-size: 0.85rem; }
    a.edit:hover { color: var(--text); }
    button.small { padding: 4px 10px; font-size: 0.85rem; white-space: nowrap; }

    .wish-form { grid-template-columns: repeat(4, 1fr); margin-bottom: 8px; }
    .wish-form .wide { grid-column: span 2; }
    .wish-form .primary.wide, .wish-form .full-row { grid-column: 1 / -1; }
    .photo-field { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; }
    .photo-field input { flex: 1; }
    .photo-preview { flex: none; width: 56px; height: 56px; }
    .photo-preview .thumb { width: 56px; height: 56px; }
    .upload-btn {
      flex: none;
      cursor: pointer;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      white-space: nowrap;
    }
    .upload-btn:focus-within { outline: 2px solid var(--accent); }

    .autofill-note { margin: -2px 0 2px; font-size: 0.85rem; color: var(--muted); }
    .autofill-note:empty { display: none; }
    .autofilled { box-shadow: inset 0 0 0 1px var(--accent); }
    @media (max-width: 760px) {
      .wish-form { grid-template-columns: 1fr 1fr; }
      .wish-form .wide { grid-column: 1 / -1; }
    }

    #submit-item { grid-column: 1 / -1; }
    .add-form.editing #submit-item { grid-column: auto; }
    .add-form.editing { outline: 2px solid var(--accent); outline-offset: 8px; border-radius: 4px; }
    .item.editing { background: var(--accent-soft); }

    .add-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .add-form .wide { grid-column: 1 / -1; }

    ul { list-style: none; margin: 0; padding: 0; }

    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .thumb {
      width: 44px;
      height: 44px;
      flex: none;
      border-radius: 6px;
      background: var(--accent-soft);
      object-fit: cover;
      display: grid;
      place-items: center;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .item { flex-wrap: wrap; }
    /* Text keeps at least 150px; on narrow screens the row's buttons wrap underneath instead of crushing it */
    .item-text { flex: 1 1 150px; min-width: 0; overflow-wrap: anywhere; }
    .item-name { font-weight: 500; }
    .meta { color: var(--muted); font-size: 0.85rem; }

    .muted { color: var(--muted); font-size: 0.9rem; }

    .look {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
    }

    .look.picked { border-color: var(--pick); box-shadow: inset 0 0 0 1px var(--pick); }

    .look-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-text);
      background: var(--pick);
      border-radius: 999px;
      padding: 2px 8px;
    }

    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

    .lookbook { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .lookbook .look { margin-top: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Designer Outfit Selector</h1>
      <div class="profile-bar">
        <label for="profile-select" class="muted">Styling for</label>
        <select id="profile-select"></select>
        <button type="button" id="new-profile">+ New client</button>
        <button type="button" id="delete-profile">Delete</button>
      </div>
    </header>

    <div class="grid">
      <section>
        <h2>Wardrobe</h2>
        <form id="add-item" class="add-form">
          <input class="wide" id="item-link" type="url" placeholder="Product link (optional) — paste to fill in the details" aria-label="Product link">
          <p class="wide autofill-note" id="item-note" aria-live="polite"></p>
          <input class="wide" id="item-name" placeholder="Piece (e.g. Silk wrap blouse)" aria-label="Piece name" autocomplete="off">
          <input id="item-designer" placeholder="Designer" aria-label="Designer" autocomplete="off">
          <input id="item-store" placeholder="Store (optional)" aria-label="Store" autocomplete="off">
          <select id="item-category" aria-label="Category"></select>
          <input id="item-size" placeholder="Size (optional)" aria-label="Size" autocomplete="off">
          <input class="wide" id="item-price" type="number" min="0" step="0.01" placeholder="Price (optional)" aria-label="Price">
          <div class="photo-field">
            <div class="photo-preview" id="item-photo-preview"></div>
            <input id="item-image" type="url" placeholder="Photo link (fills in from the product link)" aria-label="Photo link">
            <label class="upload-btn">Upload photo<input type="file" accept="image/*" id="item-upload" hidden></label>
            <button type="button" class="edit" id="item-photo-remove" hidden>Remove</button>
          </div>
          <button class="primary" type="submit" id="submit-item">Add piece</button>
          <button type="button" id="cancel-edit" hidden>Cancel</button>
        </form>
        <div id="wardrobe"></div>
      </section>

      <section>
        <h2>Style me</h2>
        <p class="muted" id="style-hint"></p>
        <div id="suggestion"></div>
        <div class="actions">
          <button class="primary" type="button" id="style-me">Style me</button>
          <button type="button" id="save-look" disabled>Save to lookbook</button>
        </div>
      </section>

      <section class="full">
        <h2 id="wishlist-title">Wishlist</h2>
        <p class="muted">Pieces to buy. Once one is bought, move it into the wardrobe.</p>
        <form id="add-wish" class="add-form wish-form">
          <input class="full-row" id="wish-link" type="url" placeholder="Paste a product link (Nordstrom, Max Mara, The Row…) to fill in the details" aria-label="Product link">
          <p class="full-row autofill-note" id="wish-note" aria-live="polite"></p>
          <input class="wide" id="wish-name" placeholder="Piece (e.g. Camel coat)" aria-label="Wishlist piece name" autocomplete="off">
          <input class="wide" id="wish-designer" placeholder="Designer" aria-label="Designer" autocomplete="off">
          <input class="wide" id="wish-store" placeholder="Store (e.g. Nordstrom, Amazon, brand site)" aria-label="Store" autocomplete="off">
          <select id="wish-category" aria-label="Category"></select>
          <input id="wish-size" placeholder="Size (optional)" aria-label="Size" autocomplete="off">
          <input class="wide" id="wish-price" type="number" min="0" step="0.01" placeholder="Price (optional)" aria-label="Price">
          <div class="photo-field">
            <div class="photo-preview" id="wish-photo-preview"></div>
            <input id="wish-image" type="url" placeholder="Photo link (fills in from the product link)" aria-label="Photo link">
            <label class="upload-btn">Upload photo<input type="file" accept="image/*" id="wish-upload" hidden></label>
            <button type="button" class="edit" id="wish-photo-remove" hidden>Remove</button>
          </div>
          <button class="primary wide" type="submit">Add to wishlist</button>
        </form>
        <ul id="wishlist"></ul>
        <p class="meta" id="wishlist-total"></p>
      </section>

      <section class="full">
        <h2 id="lookbook-title">Lookbook</h2>
        <div id="lookbook"></div>
      </section>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "outfit-selector";

    const CATEGORIES = ["Top", "Bottom", "Dress", "Outerwear", "Shoes", "Accessory"];

    const $ = id => document.getElementById(id);

    let state = loadState();
    let suggestion = null; // array of item ids for the current "Style me" result, not yet saved
    let editingId = null;  // id of the piece loaded into the form for editing, or null when adding

    function newId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    function newProfile(name) {
      return { id: newId(), name, items: [], looks: [], wishlist: [] };
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && saved.profiles && saved.profiles.length) {
          // Profiles saved before the wishlist existed get an empty one
          saved.profiles.forEach(p => { p.wishlist = p.wishlist || []; });
          return saved;
        }
      } catch {}
      const me = newProfile("My wardrobe");
      return { profiles: [me], currentId: me.id };
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch {
        // Uploaded photos are the big items; browsers allow roughly 5 MB per site
        alert("Couldn't save: this browser's storage for the app is full. Try removing some uploaded photos.");
      }
    }

    function current() {
      return state.profiles.find(p => p.id === state.currentId) || state.profiles[0];
    }

    function itemById(profile, id) {
      return profile.items.find(item => item.id === id);
    }

    function pickRandom(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function formatPrice(n) {
      return "$" + n.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }

    // Builds one outfit: either a dress or a top + bottom, then one of each finishing category that has pieces
    function styleOutfit(profile) {
      const byCat = cat => profile.items.filter(item => item.category === cat);
      const dresses = byCat("Dress");
      const tops = byCat("Top");
      const bottoms = byCat("Bottom");
      const canSeparates = tops.length > 0 && bottoms.length > 0;

      const outfit = [];
      if (dresses.length && (!canSeparates || Math.random() < 0.5)) {
        outfit.push(pickRandom(dresses));
      } else if (canSeparates) {
        outfit.push(pickRandom(tops), pickRandom(bottoms));
      } else {
        return null;
      }

      for (const cat of ["Outerwear", "Shoes", "Accessory"]) {
        const options = byCat(cat);
        if (options.length) outfit.push(pickRandom(options));
      }
      return outfit.map(item => item.id);
    }

    // A photo from an http(s) link or the user's own upload (stored as a JPEG data URL)
    const isPhotoSrc = src => /^https?:\/\//i.test(src || "") || /^data:image\/(jpeg|png|webp|gif);base64,/i.test(src || "");

    // Photo if there is one, otherwise a lettered placeholder
    function thumb(item) {
      const ph = document.createElement("div");
      ph.className = "thumb";
      ph.textContent = item.category.slice(0, 3);

      if (isPhotoSrc(item.image)) {
        const img = document.createElement("img");
        img.className = "thumb";
        img.src = item.image;
        img.alt = item.name;
        img.referrerPolicy = "no-referrer";
        img.addEventListener("error", () => img.replaceWith(ph)); // dead link falls back to the placeholder
        return img;
      }
      return ph;
    }

    // Wardrobe rows pass { onEdit, onDelete }, wishlist rows { showLink, onMove, onDelete };
    // rows inside looks pass nothing and stay read-only
    function itemRow(item, { onEdit, showLink, onMove, onDelete } = {}) {
      const li = document.createElement("li");
      li.className = "item" + (item.id === editingId ? " editing" : "");

      const text = document.createElement("div");
      text.className = "item-text";
      const name = document.createElement("div");
      name.className = "item-name";
      name.textContent = item.name;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = [item.designer, item.category, item.size ? "Size " + item.size : "",
        item.price != null ? formatPrice(item.price) : "", item.store ? "at " + item.store : ""]
        .filter(Boolean).join(" · ");
      text.append(name, meta);

      li.append(thumb(item), text);

      if (onEdit) {
        const edit = document.createElement("button");
        edit.className = "edit";
        edit.type = "button";
        edit.textContent = "Edit";
        edit.setAttribute("aria-label", "Edit " + item.name);
        edit.addEventListener("click", onEdit);
        li.append(edit);
      }

      // Product link opens the store page in a new tab; only http(s) links are shown
      if (showLink && item.link && /^https?:\/\//i.test(item.link)) {
        const a = document.createElement("a");
        a.className = "edit";
        a.href = item.link;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = "View";
        a.setAttribute("aria-label", "View " + item.name + " in store");
        a.addEventListener("click", event => viewProduct(event, item.link));
        li.append(a);
      }

      if (onMove) {
        const move = document.createElement("button");
        move.className = "small";
        move.type = "button";
        move.textContent = "Move to wardrobe";
        move.addEventListener("click", onMove);
        li.append(move);
      }

      if (onDelete) {
        const del = document.createElement("button");
        del.className = "icon";
        del.textContent = "×";
        del.setAttribute("aria-label", "Remove " + item.name);
        del.addEventListener("click", onDelete);
        li.append(del);
      }
      return li;
    }

    function lookTotal(items) {
      const priced = items.filter(item => item.price != null);
      return priced.length ? formatPrice(priced.reduce((sum, item) => sum + item.price, 0)) : "";
    }

    function renderProfiles() {
      const select = $("profile-select");
      select.innerHTML = "";
      for (const p of state.profiles) {
        const opt = document.createElement("option");
        opt.value = p.id;
        opt.textContent = p.name;
        select.append(opt);
      }
      select.value = current().id;
      $("delete-profile").disabled = state.profiles.length === 1;
    }

    function renderWardrobe() {
      const profile = current();
      const box = $("wardrobe");
      box.innerHTML = "";

      if (!profile.items.length) {
        const p = document.createElement("p");
        p.className = "muted";
        p.textContent = "No pieces yet. Add a few tops, bottoms or dresses to get started.";
        box.append(p);
        return;
      }

      for (const cat of CATEGORIES) {
        const items = profile.items.filter(item => item.category === cat);
        if (!items.length) continue;
        const h = document.createElement("h3");
        h.textContent = cat;
        const ul = document.createElement("ul");
        for (const item of items) {
          ul.append(itemRow(item, { onEdit: () => startEdit(item), showLink: true, onDelete: () => deleteItem(item.id) }));
        }
        box.append(h, ul);
      }
    }

    function renderSuggestion() {
      const profile = current();
      const box = $("suggestion");
      box.innerHTML = "";

      const ready = profile.items.some(i => i.category === "Dress") ||
        (profile.items.some(i => i.category === "Top") && profile.items.some(i => i.category === "Bottom"));
      $("style-me").disabled = !ready;
      $("style-hint").textContent = ready
        ? "Pick a random outfit from this wardrobe."
        : "Add a dress, or a top and a bottom, to start styling.";

      if (!suggestion) {
        $("save-look").disabled = true;
        return;
      }

      const items = suggestion.map(id => itemById(profile, id)).filter(Boolean);
      const look = document.createElement("div");
      look.className = "look";
      const ul = document.createElement("ul");
      items.forEach(item => ul.append(itemRow(item)));
      look.append(ul);
      const total = lookTotal(items);
      if (total) {
        const t = document.createElement("p");
        t.className = "meta";
        t.textContent = "Look total: " + total;
        look.append(t);
      }
      box.append(look);
      $("save-look").disabled = false;
    }

    function renderLookbook() {
      const profile = current();
      $("lookbook-title").textContent = profile.name + " — Lookbook";
      const box = $("lookbook");
      box.innerHTML = "";

      if (!profile.looks.length) {
        const p = document.createElement("p");
        p.className = "muted";
        p.textContent = "No saved looks yet. Use Style me, then save the ones worth showing.";
        box.append(p);
        return;
      }

      box.className = "lookbook";
      profile.looks.forEach((look, index) => {
        const items = look.itemIds.map(id => itemById(profile, id)).filter(Boolean);
        const card = document.createElement("div");
        card.className = "look" + (look.picked ? " picked" : "");

        const head = document.createElement("div");
        head.className = "look-head";
        const title = document.createElement("strong");
        title.textContent = "Look " + (index + 1);
        head.append(title);
        if (look.picked) {
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = "✓ Client's pick";
          head.append(badge);
        }

        const ul = document.createElement("ul");
        items.forEach(item => ul.append(itemRow(item)));

        const actions = document.createElement("div");
        actions.className = "actions";
        const pick = document.createElement("button");
        pick.type = "button";
        pick.textContent = look.picked ? "Unmark pick" : "Mark as pick";
        pick.addEventListener("click", () => {
          look.picked = !look.picked;
          saveState();
          renderLookbook();
        });
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "Remove look";
        remove.addEventListener("click", () => {
          profile.looks = profile.looks.filter(l => l.id !== look.id);
          saveState();
          renderLookbook();
        });
        actions.append(pick, remove);

        card.append(head, ul);
        const total = lookTotal(items);
        if (total) {
          const t = document.createElement("p");
          t.className = "meta";
          t.textContent = "Look total: " + total;
          card.append(t);
        }
        card.append(actions);
        box.append(card);
      });
    }

    function renderWishlist() {
      const profile = current();
      $("wishlist-title").textContent = profile.name + " — Wishlist";
      const list = $("wishlist");
      list.innerHTML = "";

      if (!profile.wishlist.length) {
        const li = document.createElement("li");
        li.className = "muted";
        li.textContent = "Nothing on the wishlist yet.";
        list.append(li);
      }

      for (const wish of profile.wishlist) {
        list.append(itemRow(wish, {
          showLink: true,
          onMove: () => moveToWardrobe(wish.id),
          onDelete: () => {
            profile.wishlist = profile.wishlist.filter(w => w.id !== wish.id);
            saveState();
            renderWishlist();
          }
        }));
      }

      const total = lookTotal(profile.wishlist);
      $("wishlist-total").textContent = total ? "Wishlist total: " + total : "";
    }

    // Bought: the piece leaves the wishlist and joins the wardrobe, keeping its id, details and product link
    function moveToWardrobe(id) {
      const profile = current();
      const wish = profile.wishlist.find(w => w.id === id);
      if (!wish) return;
      profile.wishlist = profile.wishlist.filter(w => w.id !== id);
      profile.items.push(wish);
      saveState();
      renderAll();
    }

    function renderAll() {
      renderProfiles();
      renderWardrobe();
      renderSuggestion();
      renderWishlist();
      renderLookbook();
    }

    // Removing a piece also removes it from saved looks; a look left with nothing in it is dropped
    function deleteItem(id) {
      const profile = current();
      profile.items = profile.items.filter(item => item.id !== id);
      profile.looks = profile.looks
        .map(look => ({ ...look, itemIds: look.itemIds.filter(x => x !== id) }))
        .filter(look => look.itemIds.length);
      if (suggestion && suggestion.includes(id)) suggestion = null;
      if (editingId === id) stopEdit();
      saveState();
      renderAll();
    }

    for (const cat of CATEGORIES) {
      const opt = document.createElement("option");
      opt.value = cat;
      opt.textContent = cat;
      $("item-category").append(opt);
      $("wish-category").append(opt.cloneNode(true));
    }

    $("add-wish").addEventListener("submit", event => {
      event.preventDefault();
      const name = $("wish-name").value.trim();
      if (!name) {
        $("wish-name").focus();
        return;
      }
      const priceText = $("wish-price").value.trim();
      const price = priceText === "" ? null : Number(priceText);
      current().wishlist.push({
        id: newId(),
        name,
        designer: $("wish-designer").value.trim(),
        category: $("wish-category").value,
        size: $("wish-size").value.trim(),
        store: $("wish-store").value.trim(),
        price: Number.isFinite(price) && price >= 0 ? price : null,
        image: photo.wish.src,
        link: $("wish-link").value.trim()
      });
      saveState();
      resetWishForm();
      $("wish-link").focus();
      renderWishlist();
    });

    // ---- Autofill from a product link ----
    // Reads only the link text itself (no page fetch): store links carry the designer and
    // piece name in the URL slug, and sometimes the size as a query parameter.

    // Single-brand store domains: the designer is the store itself
    const BRAND_SITES = {
      "maxmara.com": "Max Mara",
      "therow.com": "The Row",
      "toteme-studio.com": "Toteme",
      "toteme.com": "Toteme",
      "lafayette148ny.com": "Lafayette 148 New York",
      "quince.com": "Quince"
    };

    // Where to buy: brand sites sell their own label; the rest are multi-brand stores.
    // An unrecognised domain leaves Store blank for the user to fill in.
    const STORE_SITES = {
      ...BRAND_SITES,
      "nordstrom.com": "Nordstrom",
      "nordstromrack.com": "Nordstrom Rack",
      "saksfifthavenue.com": "Saks Fifth Avenue",
      "neimanmarcus.com": "Neiman Marcus",
      "bergdorfgoodman.com": "Bergdorf Goodman",
      "bloomingdales.com": "Bloomingdale's",
      "macys.com": "Macy's",
      "net-a-porter.com": "Net-a-Porter",
      "mytheresa.com": "Mytheresa",
      "farfetch.com": "Farfetch",
      "ssense.com": "SSENSE",
      "shopbop.com": "Shopbop",
      "revolve.com": "Revolve",
      "zappos.com": "Zappos"
    };

    function storeFor(host) {
      if (/^(smile\.)?amazon\.[a-z.]+$/.test(host)) return "Amazon"; // amazon.com, amazon.co.uk, ...
      const key = Object.keys(STORE_SITES).find(d => host === d || host.endsWith("." + d));
      return key ? STORE_SITES[key] : "";
    }

    // Designers recognised at the start of a multi-brand store's slug (e.g. Nordstrom), longest first
    const KNOWN_DESIGNERS = [
      "Lafayette 148 New York", "Lafayette 148", "Max Mara", "Weekend Max Mara", "'S Max Mara", "The Row",
      "Toteme", "Quince", "Vince", "Theory", "Eileen Fisher", "St. John", "Veronica Beard", "Frame",
      "Agolde", "Khaite", "Staud", "Ganni", "Acne Studios", "Tory Burch", "Kate Spade New York",
      "Madewell", "Reformation", "Nili Lotan", "Joseph", "Equipment", "Mejuri", "Gucci",
      "Prada", "Saint Laurent", "Loewe", "Jil Sander", "Brunello Cucinelli", "Loro Piana", "Ugg",
      "Nike", "Sam Edelman", "Stuart Weitzman", "Cole Haan", "Nordstrom", "Halogen", "Caslon"
    ].sort((a, b) => b.length - a.length);

    // Last matching word wins, since the garment noun usually ends the name ("Shirt Dress" is a Dress)
    const CATEGORY_WORDS = {
      Outerwear: ["coat", "jacket", "blazer", "trench", "parka", "cape", "puffer", "anorak", "peacoat", "overcoat"],
      Bottom: ["pant", "pants", "trouser", "trousers", "jean", "jeans", "skirt", "short", "shorts", "legging", "leggings", "culotte", "culottes"],
      Dress: ["dress", "gown", "jumpsuit", "romper", "caftan", "kaftan"],
      Shoes: ["shoe", "shoes", "boot", "boots", "bootie", "booties", "loafer", "loafers", "sneaker", "sneakers", "pump", "pumps",
        "sandal", "sandals", "mule", "mules", "flat", "flats", "heel", "heels", "slingback", "slingbacks", "espadrille", "espadrilles"],
      Accessory: ["bag", "tote", "clutch", "scarf", "belt", "earring", "earrings", "necklace", "bracelet", "ring", "hat", "beanie",
        "sunglasses", "wallet", "crossbody", "hoops", "gloves", "wrap"],
      Top: ["top", "sweater", "shirt", "blouse", "tee", "t-shirt", "crewneck", "cardigan", "tank", "turtleneck", "pullover",
        "polo", "camisole", "cami", "bodysuit", "knit", "henley", "hoodie", "sweatshirt", "vest"]
    };

    const slugWords = text => text.toLowerCase().split(/[-_+\s]+/).filter(Boolean);
    const titleCase = words => words.map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");

    function guessCategory(words) {
      let found = null;
      for (const word of words) {
        for (const [cat, list] of Object.entries(CATEGORY_WORDS)) {
          if (list.includes(word)) found = cat;
        }
      }
      return found;
    }

    function parseProductLink(text) {
      let url;
      try {
        url = new URL(text.trim());
      } catch {
        return null;
      }
      if (!/^https?:$/.test(url.protocol)) return null;

      const host = url.hostname.replace(/^www\./, "");
      const brandKey = Object.keys(BRAND_SITES).find(d => host === d || host.endsWith("." + d));

      // The slug is the path segment with the most words, e.g. "max-mara-manuela-camel-hair-wrap-coat"
      const segments = url.pathname.split("/").map(s => decodeURIComponent(s).replace(/\.html?$/i, ""));
      const slug = segments
        .filter(s => /[a-z]/i.test(s) && s.includes("-"))
        .sort((a, b) => slugWords(b).length - slugWords(a).length)[0] || "";

      // Drop product codes ("p-1016043106001") but keep short numbers that belong to names ("148")
      let words = slugWords(slug).filter(w => !/^\d{5,}$/.test(w) && !/^[a-z]?\d{6,}[a-z]?$/.test(w));
      if (words[0] === "p") words = words.slice(1);

      let designer = brandKey ? BRAND_SITES[brandKey] : "";
      const startsWith = name => {
        const parts = slugWords(name.replace(/[.']/g, ""));
        return parts.length <= words.length && parts.every((p, i) => words[i] === p) ? parts.length : 0;
      };
      for (const name of brandKey ? [designer] : KNOWN_DESIGNERS) {
        const n = startsWith(name);
        if (n) {
          designer = name;
          words = words.slice(n);
          break;
        }
      }

      const params = url.searchParams;
      const size = params.get("size") || params.get("sz") || params.get("selectedSize") || "";

      return {
        name: titleCase(words),
        designer,
        category: guessCategory(words),
        store: storeFor(host),
        size: size.toUpperCase().length <= 4 ? size.toUpperCase() : size
      };
    }

    // Both forms autofill the same way; field ids are "<prefix>-<field>", e.g. "item-name", "wish-store"
    const AUTOFILL_FIELDS = ["name", "designer", "store", "category", "size", "price"];

    // Two-part status line under the link: what the link text gave, and what the photo lookup found
    const notes = { item: { local: "", photo: "" }, wish: { local: "", photo: "" } };
    function setNote(prefix, part, text) {
      notes[prefix][part] = text;
      $(`${prefix}-note`).textContent = [notes[prefix].local, notes[prefix].photo].filter(Boolean).join(" ");
    }

    // Typed fields are left alone; autofilled ones follow the current link, going blank when it doesn't say.
    // Returns true when the field was filled.
    function fillField(prefix, key, value) {
      const field = $(`${prefix}-${key}`);
      if (field.dataset.typed) return false;
      if (value == null || value === "") {
        if (field.classList.contains("autofilled") && field.tagName !== "SELECT") field.value = "";
        field.classList.remove("autofilled");
        return false;
      }
      field.value = value;
      field.classList.add("autofilled");
      return true;
    }

    // Step 1, instant: read what the link text itself says
    function autofillFromLink(prefix) {
      const link = $(`${prefix}-link`).value.trim();
      if (!link) {
        setNote(prefix, "local", "");
        setNote(prefix, "photo", "");
        return;
      }
      const parsed = parseProductLink(link);
      const readable = parsed && (parsed.name || parsed.designer || parsed.store);
      const info = readable ? parsed : {};

      const filled = AUTOFILL_FIELDS.filter(key => fillField(prefix, key, info[key]));
      if (!readable) {
        setNote(prefix, "local", "Couldn't read details from this link. Fill them in below.");
      } else {
        setNote(prefix, "local", filled.length
          ? `Filled in ${filled.join(", ")} from the link. Check them before saving.`
          : "Nothing new to fill in from this link.");
      }
      if (parsed) scheduleLookup(prefix, link);
    }

    // ---- Step 2: product photo and price from the store's page, via /api/product ----

    const lookupTimers = {};
    const lookupSeq = { item: 0, wish: 0 };

    // The lookup only exists when the app runs on Vercel or `npm run dev`
    function fetchProductInfo(link, timeoutMs = 10000) {
      return fetch("/api/product?url=" + encodeURIComponent(link), { signal: AbortSignal.timeout(timeoutMs) })
        .then(r => r.headers.get("content-type")?.includes("json") ? r.json() : Promise.reject(new Error("no lookup")));
    }

    function scheduleLookup(prefix, link) {
      clearTimeout(lookupTimers[prefix]);
      const seq = ++lookupSeq[prefix];
      // Wait until pasting/typing pauses, so a half-typed link isn't looked up
      lookupTimers[prefix] = setTimeout(() => lookUpProduct(prefix, link, seq), 500);
    }

    async function lookUpProduct(prefix, link, seq) {
      const wantsPhoto = ["", "auto"].includes(photo[prefix].source);
      setNote(prefix, "photo", wantsPhoto ? "Looking up the product photo…" : "Checking the product page…");

      let info;
      try {
        info = await fetchProductInfo(link);
      } catch {
        info = { error: true };
      }
      if (seq !== lookupSeq[prefix]) return; // the link changed while we were waiting

      const store = $(`${prefix}-store`).value || "This store";
      if (info.error) {
        if (photo[prefix].source === "auto") setPhoto(prefix, "", "");
        setNote(prefix, "photo", "Photo lookup isn't available here. Paste a photo link or upload a photo.");
        return;
      }
      if (!info.found) {
        if (photo[prefix].source === "auto") setPhoto(prefix, "", "");
        setNote(prefix, "photo", info.available === false
          ? "This product page looks sold out or removed."
          : `${store} doesn't share product photos with apps. Right-click the photo on the store page, choose "Copy Image Address", and paste it below, or upload a photo.`);
        return;
      }

      const got = [];
      if (wantsPhoto && info.image) {
        setPhoto(prefix, info.image, "auto");
        got.push("photo");
      }
      if (info.price != null && (!info.currency || info.currency === "USD") && fillField(prefix, "price", info.price)) got.push("price");
      if (!$(`${prefix}-name`).value && fillField(prefix, "name", info.name)) got.push("name");
      if (!$(`${prefix}-designer`).value && fillField(prefix, "designer", info.brand)) got.push("designer");

      const stock = info.available === false ? " Currently sold out." : "";
      const kept = wantsPhoto ? "" : " Kept your photo.";
      setNote(prefix, "photo", ((got.length ? `Found the ${got.join(", ")} on the store page.` : "") + kept + stock).trim());
    }

    // ---- Photo field: link, upload, or found by the lookup ----
    // source: "" none, "auto" from the lookup (follows the link), "link" pasted by the user,
    // "upload" the user's own photo, "kept" the saved photo of a piece being edited.
    // Only "" and "auto" are ever replaced automatically.
    const photo = { item: { src: "", source: "" }, wish: { src: "", source: "" } };

    function setPhoto(prefix, src, source) {
      photo[prefix] = { src, source: src ? source : "" };
      const input = $(`${prefix}-image`);
      input.value = src.startsWith("data:") ? "" : src;
      input.placeholder = src.startsWith("data:") ? "Your uploaded photo" : "Photo link (fills in from the product link)";
      input.classList.toggle("autofilled", source === "auto" && Boolean(src));
      renderPhotoPreview(prefix);
    }

    function renderPhotoPreview(prefix) {
      const { src } = photo[prefix];
      const box = $(`${prefix}-photo-preview`);
      box.innerHTML = "";
      box.append(thumb({ image: src, name: "Photo preview", category: "Photo" }));
      $(`${prefix}-photo-remove`).hidden = !src;
    }

    // Shrinks an uploaded photo to at most 600px and JPEG, so it fits in the browser's storage
    function compressPhoto(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, 600 / Math.max(img.naturalWidth, img.naturalHeight));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.naturalWidth * scale);
          canvas.height = Math.round(img.naturalHeight * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL("image/jpeg", 0.82));
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("Couldn't read that image"));
        };
        img.src = url;
      });
    }

    // Clears autofill highlights, "typed" marks and the photo; with clearValues, empties the fields too
    function resetAutofill(prefix, clearValues) {
      clearTimeout(lookupTimers[prefix]);
      lookupSeq[prefix]++;
      setNote(prefix, "local", "");
      setNote(prefix, "photo", "");
      for (const key of AUTOFILL_FIELDS) {
        const field = $(`${prefix}-${key}`);
        delete field.dataset.typed;
        field.classList.remove("autofilled");
        if (clearValues && field.tagName !== "SELECT") field.value = "";
      }
      setPhoto(prefix, "", "");
    }

    for (const prefix of ["item", "wish"]) {
      // A field the user edits by hand is never overwritten by autofill
      for (const key of AUTOFILL_FIELDS) {
        const field = $(`${prefix}-${key}`);
        field.addEventListener("input", () => {
          field.dataset.typed = "1";
          field.classList.remove("autofilled");
        });
      }
      $(`${prefix}-link`).addEventListener("input", () => autofillFromLink(prefix));

      $(`${prefix}-image`).addEventListener("input", event => {
        const src = event.target.value.trim();
        photo[prefix] = { src, source: src ? "link" : "" };
        event.target.classList.remove("autofilled");
        renderPhotoPreview(prefix);
      });
      $(`${prefix}-upload`).addEventListener("change", async event => {
        const file = event.target.files[0];
        event.target.value = "";
        if (!file) return;
        try {
          setPhoto(prefix, await compressPhoto(file), "upload");
        } catch {
          alert("That file couldn't be read as a photo. Try a JPEG or PNG.");
        }
      });
      $(`${prefix}-photo-remove`).addEventListener("click", () => setPhoto(prefix, "", ""));
      renderPhotoPreview(prefix);
    }

    function resetWishForm() {
      $("add-wish").reset();
      resetAutofill("wish");
    }

    // View checks the product page first: if it's gone, open the store's home page instead
    async function viewProduct(event, link) {
      event.preventDefault();
      const tab = window.open("about:blank", "_blank"); // opened now, while the click still allows a new tab
      let target = link;
      try {
        const info = await fetchProductInfo(link, 5000);
        if (info.available === false) target = new URL(link).origin + "/";
      } catch {
        // No lookup available: just open the product link
      }
      if (tab) {
        tab.opener = null;
        tab.location.href = target;
      } else {
        window.open(target, "_blank", "noopener");
      }
    }

    // Loads a piece into the add form; submitting then saves changes instead of adding
    function startEdit(item) {
      editingId = item.id;
      resetAutofill("item");
      $("item-link").value = item.link || "";
      $("item-name").value = item.name;
      $("item-designer").value = item.designer;
      $("item-store").value = item.store || "";
      $("item-category").value = item.category;
      $("item-size").value = item.size || "";
      $("item-price").value = item.price != null ? item.price : "";
      // The piece's saved details count as typed, so pasting a new link won't overwrite them
      for (const key of AUTOFILL_FIELDS) {
        if ($(`item-${key}`).value) $(`item-${key}`).dataset.typed = "1";
      }
      setPhoto("item", item.image || "", "kept");
      $("submit-item").textContent = "Save changes";
      $("cancel-edit").hidden = false;
      $("add-item").classList.add("editing");
      $("add-item").scrollIntoView({ behavior: "smooth", block: "center" });
      $("item-name").focus({ preventScroll: true });
      renderWardrobe();
    }

    function stopEdit() {
      editingId = null;
      $("add-item").reset();
      resetAutofill("item");
      $("submit-item").textContent = "Add piece";
      $("cancel-edit").hidden = true;
      $("add-item").classList.remove("editing");
    }

    $("cancel-edit").addEventListener("click", () => {
      stopEdit();
      renderWardrobe();
    });

    $("add-item").addEventListener("submit", event => {
      event.preventDefault();
      const name = $("item-name").value.trim();
      if (!name) {
        $("item-name").focus();
        return;
      }
      const priceText = $("item-price").value.trim();
      const price = priceText === "" ? null : Number(priceText);
      const fields = {
        image: photo.item.src,
        name,
        designer: $("item-designer").value.trim(),
        store: $("item-store").value.trim(),
        category: $("item-category").value,
        size: $("item-size").value.trim(),
        price: Number.isFinite(price) && price >= 0 ? price : null,
        link: $("item-link").value.trim()
      };

      const editing = editingId && itemById(current(), editingId);
      if (editing) {
        Object.assign(editing, fields);
        stopEdit();
      } else {
        current().items.push({ id: newId(), image: "", ...fields });
        // Keep designer and category for quick entry of several pieces from the same label
        const designer = $("item-designer").value;
        const category = $("item-category").value;
        resetAutofill("item", true);
        $("item-link").value = "";
        $("item-price").value = "";
        $("item-designer").value = designer;
        $("item-category").value = category;
        $("item-link").focus();
      }
      saveState();
      // Re-render everything so an edited name or photo also updates the suggestion and saved looks
      renderAll();
    });

    $("style-me").addEventListener("click", () => {
      suggestion = styleOutfit(current());
      renderSuggestion();
    });

    $("save-look").addEventListener("click", () => {
      if (!suggestion) return;
      current().looks.push({ id: newId(), itemIds: suggestion, picked: false });
      suggestion = null;
      saveState();
      renderSuggestion();
      renderLookbook();
    });

    $("profile-select").addEventListener("change", event => {
      state.currentId = event.target.value;
      suggestion = null;
      stopEdit();
      saveState();
      renderAll();
    });

    $("new-profile").addEventListener("click", () => {
      const name = (prompt("Client name?") || "").trim();
      if (!name) return;
      const profile = newProfile(name);
      state.profiles.push(profile);
      state.currentId = profile.id;
      suggestion = null;
      stopEdit();
      saveState();
      renderAll();
    });

    $("delete-profile").addEventListener("click", () => {
      if (state.profiles.length === 1) return;
      const profile = current();
      if (!confirm(`Delete ${profile.name} and their whole wardrobe and lookbook?`)) return;
      state.profiles = state.profiles.filter(p => p.id !== profile.id);
      state.currentId = state.profiles[0].id;
      suggestion = null;
      stopEdit();
      saveState();
      renderAll();
    });

    renderAll();
  </script>
</body>
</html>
